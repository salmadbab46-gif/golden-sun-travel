<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — The Golden Sun Travel, Agafay Desert</title>
<meta name="description" content="Get in touch with The Golden Sun Travel to plan your Agafay Desert experience near Marrakech — by phone, email, Instagram, Facebook or WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav-key="contact">
<script>window.SITE_ROOT = "";</script>
<div id="svg-sprite-placeholder"></div>
<div id="nav-placeholder"></div>
<div id="mobile-sticky-placeholder"></div>

<section class="page-hero">
  <div class="container">
    <p class="eyebrow">Get in touch</p>
    <h1>Let's Plan Your <em style="color:var(--gold-bright); font-style:normal;">Golden Experience</em></h1>
  </div>
</section>

<section class="section-pad bg-charcoal">
  <div class="container contact-grid">
    <div class="contact-info reveal">
      <p class="loc">📍 Marrakech — Agafay Desert, Morocco</p>
      <div class="contact-list">
        <a href="#" id="contactPhone"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1.1.4 2.2.7 3.2a2 2 0 0 1-.5 2.1L8 10.3a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .4 2.1.6 3.2.7a2 2 0 0 1 1.4 2Z"/></svg></span><span id="contactPhoneText">Phone — add in site.config.js</span></a>
        <a href="#" id="contactEmail"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 6l8 7 8-7"/></svg></span><span id="contactEmailText">Email — add in site.config.js</span></a>
        <a href="#" id="contactInsta"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></span>Instagram</a>
        <a href="#" id="contactFb"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></span>Facebook</a>
      </div>
      <div class="contact-wa-cta">
        <p>Prefer WhatsApp?</p>
        <a href="#" class="btn btn-whatsapp" id="contactWaBtn"><svg width="16" height="16" viewBox="0 0 24 24"><use href="#ico-whatsapp"/></svg> Chat with us now</a>
      </div>
    </div>

    <form class="form-card reveal" id="contactForm">
      <div class="field"><label for="cName">Full name</label><input id="cName" type="text" required></div>
      <div class="field"><label for="cEmail">Email</label><input id="cEmail" type="email" required></div>
      <div class="field"><label for="cMsg">Message</label><textarea id="cMsg" required></textarea></div>
      <button type="submit" class="btn btn-gold btn-block">Send Message</button>
    </form>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="site.config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
